[wallpaper]
directory = "~/Pictures/Wallpapers"
transition = []

[wallpaper.automation]
enabled = true

[theme]
mode = "dark"
source = "community"
community_palette = "One"

[shell.animation]
enabled = false

[shell.panel]
open_near_click_control_center = true

[lockscreen]
transition = []

[bar.main]
position = "left"
thickness = 24
background_opacity = 0.25
radius = 0
margin_ends = 0
margin_edge = 0
padding = 12
widget_spacing = 8
scale = 1.0
shadow = false
start = ["control-center", "launcher", "clock"]
center = ["workspaces"]
end = ["tray", "privacy", "notifications", "network", "volume", "battery"]

[widget.workspaces]
capsule_radius = 0

[widget.privacy]
hide_inactive = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.battery]
show_label = true

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 600
